/* Hash router: #/home #/landing #/dashboard ... Each view is a <template>; anchors like #pricing still scroll in-page. */
(()=>{history.scrollRestoration='manual';const app=document.getElementById('app'),views={};document.querySelectorAll('template[data-view]').forEach(t=>views[t.dataset.view]=t);
function go(){const k=(location.hash.match(/^#\/([\w-]+)/)||[])[1]||'home',t=views[k]||views.home;app.replaceChildren(t.content.cloneNode(true));document.title='Kivora UI — '+t.dataset.title;
 document.querySelectorAll('.app-switch a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+(views[k]?k:'home')));scrollTo({top:0,behavior:'instant'});KV.init();KV.start();KV.mount()}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const h=a.getAttribute('href');if(h.startsWith('#/'))return;e.preventDefault();const t=h.length>1&&document.getElementById(h.slice(1));t&&t.scrollIntoView({behavior:'smooth'})});
addEventListener('hashchange',go);document.addEventListener('DOMContentLoaded',go)})();
</script><script>
/* Demo: an entire page built from JS classes (see js/kivora.js › UI) */
KV.apps.builder=el=>{const{Navbar,Hero,Section,Grid,Card,Stat,Chart,Tabs,Accordion,Modal,Table,Pricing,Timeline,Footer,Page,Alert}=UI.reg;
const modal=new Modal({title:'Built with JavaScript'},'Every element on this page is created by a class.');
const features=[['Compose','Nest components like building blocks.','yellow'],['Reuse','One class, endless variations.','orange'],['Update','Call .set() to re-render with new props.','mint']];
new Page({},
 new Navbar({brand:'Kivora',links:[{label:'Features',href:'#features'},{label:'Data',href:'#data'},{label:'Pricing',href:'#pricing'},{label:'FAQ',href:'#faq'}],cta:{label:'Try it',onClick:()=>modal.open()}}),
 new Hero({eyebrow:'Object-oriented UI',title:'Build pages with classes',text:'Resize the window to see the responsive navbar collapse into a menu.',actions:[{label:'Open modal',onClick:()=>modal.open()},{label:'Toast',variant:'outline',onClick:()=>KV.toast('Hello from a class','mint')}]}),
 new Section({id:'features',title:'Features',center:true},new Grid({cols:3},features.map((f,i)=>new Card({title:f[0],text:f[1],ring:i+1,color:f[2]})))),
 new Section({id:'data',title:'Data'},new Grid({cols:4},new Stat({value:87,suffix:'%',label:'Satisfaction',color:'yellow'}),new Stat({value:12,suffix:'×',label:'Faster',color:'orange'}),new Stat({value:342,prefix:'$',suffix:'K',label:'Revenue',color:'blue'}),new Stat({value:99,suffix:'%',label:'Uptime',color:'mint'})),
  new Grid({cols:2},new Chart({type:'bar',values:[12,18,26,34],labels:['Q1','Q2','Q3','Q4']}),new Chart({type:'donut',values:[40,25,20,15]})),
  new Table({head:['Workstream','Status'],rows:[['Discovery','Done'],['Build','Active']]}),
  new Timeline({steps:[{title:'Plan',text:'Scope it.',date:'Jan',color:'yellow'},{title:'Build',text:'Make it.',date:'Feb',color:'orange'},{title:'Launch',text:'Ship it.',date:'Mar',color:'mint'}]})),
 new Section({id:'pricing',title:'Pricing',dark:true},new Pricing({plans:[{name:'Starter',price:'$0',note:'Small projects'},{name:'Pro',price:'$29',note:'Teams',featured:true},{name:'Scale',price:'$99',note:'Enterprise'}]})),
 new Section({id:'faq',title:'Built from JSON'},UI.create({type:'Tabs',props:{tabs:[{label:'One',content:'Specs become DOM.'},{label:'Two',content:'Use UI.create(spec).'}]}}),new Accordion({items:[{title:'Is it accessible?',content:'ARIA roles and keyboard support included.'},{title:'Dependencies?',content:'None.'}]}),new Alert({color:'cyan',text:'Tip: extend UI.Component to make your own.'})),
 new Footer({text:'© Kivora'}),modal).mount(el)};
</script>
