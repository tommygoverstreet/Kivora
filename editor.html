function formatHTML(s){
  const chunks=s.match(/<(script|style)(\s[^>]*)?>[\s\S]*?<\/\1\s*>|<\!--[\s\S]*?-->|<!doctype(?:\"[^\"]*\"|'[^']*'|[^>])*>|<(?![A-Za-z\/!])|<\/?[A-Za-z](?:\"[^\"]*\"|'[^']*'|[^<>\"'])*>|[^<]+/gi)||[];
  let depth=0,out=[];

  for(const tk of chunks){
    if(tk.startsWith('<\!--')||/^<!doctype/i.test(tk)){push(tk,depth);continue}
    const ss=tk.match(/^<(script|style)(\s[^>]*)?>([\s\S]*)<\/\1\s*>$/i);
    if(ss){
      push('<'+ss[1].toLowerCase()+(ss[2]||'')+'>',depth);
      ss[3].split('\n').forEach(line=>{if(line.trim())out.push('  '.repeat(depth+1)+line.trim())});
      push('</'+ss[1].toLowerCase()+'>',depth);
      continue;
    }
    if(tk.startsWith('</')){depth=Math.max(0,depth-1);push(tk,depth);continue}
    if(tk.startsWith('<')){

      if(mode==='sq'||mode==='dq'){if(c==='\\'){i+=2;continue}if((mode==='sq'&&c==="'")||(mode==='dq'&&c==='"'))mode='code';i++;continue}
      if(mode==='tplLit'){if(c==='\\'){i+=2;continue}if(c==='`'){mode='code';i++;continue}if(c==='$'&&n==='{'){stack.push('t');mode='code';i+=2;continue}i++;continue}

      if(c==="'"){mode='sq';i++;continue}
      if(c==='"'){mode='dq';i++;continue}

  }
